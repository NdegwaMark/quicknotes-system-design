<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickNotes Client</title>
    <link rel="stylesheet" href="style.css">
    <script src="api.js" defer></script>
</head>
<body>
    <div class="container">
        <h1>QuickNotes App</h1>
        
        <div class="control-panel">
            <button id="load-btn">Load notes</button>
            <p id="status"></p>
        </div>

        <form id="note-form">
            <h2>Create a New Note</h2>
            <div class="form-group">
                <label for="title-input">Title (Required, max 100 chars):</label>
                <input type="text" id="title-input" placeholder="Enter note title..." maxlength="120">
            </div>
            <div class="form-group">
                <label for="body-input">Body:</label>
                <textarea id="body-input" placeholder="Enter note body..."></textarea>
            </div>
            <button type="submit" id="submit-btn">Submit Note</button>
        </form>

        <div class="notes-container">
            <h2>Your Notes</h2>
            <ul id="notes-list"></ul>
        </div>
    </div>
</body>
</html>
